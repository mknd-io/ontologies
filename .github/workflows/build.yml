# Test every push and PR; publish the site to GitHub Pages from main.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache tools and the pinned D3FEND release
        uses: actions/cache@v4
        with:
          path: |
            bin
            build/imports
            .venv
          key: tools-${{ hashFiles('Makefile', 'src/mknd-d3fend.ttl') }}

      - name: Test (seam, quality, reasoning)
        run: make test

      - name: Data quality report (non-blocking)
        run: make data-report

      - name: Build site
        run: make site

      - name: Add snapshots of earlier releases (keeps old version IRIs resolving)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            gh release download "$tag" --pattern 'mknd-site-*.tar.gz' --output - 2>/dev/null \
              | tar -xz -C build/site --skip-old-files || echo "no snapshot in $tag"
          done

      - name: Package this version's snapshot
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(make -s print-version)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != ontology version $version"; exit 1; }
          tar -czf "mknd-site-$version.tar.gz" -C build/site "$version"

      - name: Keep the snapshot for the release job
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: mknd-site-*.tar.gz

      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: build/reports

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: snapshot
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" mknd-site-*.tar.gz --repo "$GITHUB_REPOSITORY" --title "MKND ${GITHUB_REF_NAME#v}" --generate-notes

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
